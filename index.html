<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora Inteligente (IA)</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Styles (CSS incrustado) -->
  <style>
  /* =========================
     Tema técnico/profesional
     (incrustado desde styles.css)
     ========================= */

  :root{
    /* Paleta fría y limpia */
    --bg-0:#0b1020;         /* fondo base oscuro */
    --bg-1:#0f172a;         /* paneles */
    --bg-2:#111b32;         /* realce sutil */
    --tx-0:#e5eefc;         /* texto primario */
    --tx-1:#9fb2d6;         /* texto secundario */
    --acc-0:#61d2ff;        /* acento cian */
    --acc-1:#7c5cff;        /* acento violeta */
    --ring:#86e7ff;         /* foco */

    /* Bordes y sombras */
    --br:16px;
    --bd:1px solid rgba(255,255,255,.08);
    --shadow-1:0 6px 24px rgba(0,0,0,.35);
    --shadow-2:0 12px 40px rgba(10, 20, 55, .45);

    /* Tipografía */
    --font: "Inter", system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
  }

  /* ====== Fondo con malla + rejilla técnica ====== */
  html, body{height:100%}

  body{
    font-family:var(--font);
    color:var(--tx-0);
    background:
      /* Glow diagonal */
      radial-gradient(1000px 600px at 110% -10%, rgba(124,92,255,.30), transparent 55%),
      radial-gradient(800px 500px at -10% 20%, rgba(97,210,255,.28), transparent 50%),
      linear-gradient(180deg, rgba(10,18,40,.65), rgba(10,18,40,.65)),
      /* Rejilla */
      linear-gradient(transparent 0 23px, rgba(255,255,255,.05) 24px) 0 0/24px 24px,
      linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,.04) 24px) 0 0/24px 24px,
      var(--bg-0);
    background-attachment: fixed;
  }

  /* ====== Navbar ====== */
  .navbar{
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: var(--bd);
  }

  .navbar .navbar-brand .badge,
  .navbar .navbar-brand span{
    font-weight:600;
  }

  /* ====== Card de contenido (glass técnico) ====== */
  .glass-card{
    border: var(--bd);
    border-radius: var(--br);
    background:
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    box-shadow: var(--shadow-1), inset 0 1px 0 rgba(255,255,255,.06);
  }

  .card-body{
    background:
      radial-gradient(600px 300px at 10% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(500px 250px at 100% 0%, rgba(97,210,255,.16), transparent 60%);
    border-radius: calc(var(--br) - 2px);
  }

  /* ====== Titulares / textos ====== */
  h1.display-5{letter-spacing:.2px; text-shadow:0 1px 0 rgba(0,0,0,.2)}
  .lead{color:var(--tx-1)}
  .text-white-50{color:rgba(229,238,252,.6)!important}

  /* ====== Textarea ====== */
  textarea.form-control{
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.9));
    border: 1px solid rgba(155,170,210,.45);
    color:#0b1020;
    border-radius: 14px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.06);
    transition: box-shadow .2s ease, border-color .2s ease, transform .06s ease-in-out;
  }
  textarea.form-control:focus{
    border-color: var(--ring);
    box-shadow: 0 0 0 4px rgba(134,231,255,.25);
  }

  /* ====== Chips y kbd ====== */
  .chip{
    display:inline-flex; align-items:center; gap:.45rem;
    padding:6px 12px;
    border-radius:999px;
    background: linear-gradient(90deg, rgba(124,92,255,.25), rgba(97,210,255,.25));
    border: 1px solid rgba(255,255,255,.28);
    color:var(--tx-0);
    font-weight:600; font-size:.9rem;
  }

  kbd{
    background:#0f172a;
    color:#fff;
    padding:.22rem .46rem;
    border-radius:.4rem;
    border:1px solid rgba(255,255,255,.15);
    box-shadow: inset 0 -1px 0 rgba(255,255,255,.08);
  }

  /* ====== Botón principal con borde de luz ====== */
  .btn-gradient{
    position:relative;
    overflow:hidden;
    border:none;
    color:#fff;
    border-radius:14px;
    padding:.9rem 1.1rem;
    background:
      linear-gradient(90deg, var(--acc-1), var(--acc-0));
    box-shadow: 0 10px 26px rgba(17, 76, 153, .35), inset 0 1px 0 rgba(255,255,255,.15);
    transition: transform .08s ease-in-out, filter .18s ease, box-shadow .18s ease;
  }
  .btn-gradient:before{
    content:"";
    position:absolute; inset:-2px;
    border-radius:16px;
    padding:2px;
    background: conic-gradient(from 180deg at 50% 50%, rgba(124,92,255,.8), rgba(97,210,255,.8), rgba(124,92,255,.8));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity:.45; pointer-events:none;
  }
  .btn-gradient:hover{ filter:brightness(1.06); box-shadow: var(--shadow-2) }
  .btn-gradient:active{ transform: translateY(1px) scale(.997) }

  /* ====== Alertas ====== */
  .alert{
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 18px rgba(0,0,0,.25);
  }
  .alert-dark{
    color:var(--tx-0);
    background: linear-gradient(180deg, rgba(17,27,50,.85), rgba(14,22,42,.9));
    border-color: rgba(134,231,255,.15);
  }
  .alert-danger{
    background: linear-gradient(180deg, rgba(60,6,18,.85), rgba(40,6,12,.9));
    border-color: rgba(255, 97, 97, .25);
  }

  /* ====== Footer ====== */
  footer{
    border-top: var(--bd);
    background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00));
    color:var(--tx-1);
  }

  /* ====== Estados ====== */
  .badge.rounded-pill{
    background: linear-gradient(90deg, rgba(124,92,255,.25), rgba(97,210,255,.25));
    border:1px solid rgba(255,255,255,.25);
    color: var(--tx-0);
  }

  /* ====== Modo alterno opcional (si tu JS agrega .alt-theme al body) ====== */
  body.alt-theme{
    --bg-0:#f6f8ff;
    --bg-1:#fff;
    --bg-2:#ecf2ff;
    --tx-0:#0b1020;
    --tx-1:#44506e;
    background:
      radial-gradient(800px 500px at 120% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(700px 400px at -10% 0, rgba(97,210,255,.22), transparent 55%),
      linear-gradient(180deg, #eef2ff, #eef2ff),
      var(--bg-0);
  }
  body.alt-theme .glass-card{
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.9));
    border:1px solid rgba(17,27,50,.08);
    box-shadow: 0 6px 22px rgba(15,23,42,.08);
  }
  body.alt-theme .alert-dark{
    background: linear-gradient(180deg, #f7f9ff, #eef3ff);
    color:#0b1020;
    border-color: rgba(15,23,42,.08);
  }

  /* ====== Accesibilidad: foco claro en botones/links ====== */
  .btn:focus, .btn:focus-visible, button:focus{
    outline: none;
    box-shadow: 0 0 0 4px rgba(134,231,255,.28);
  }

  /* ====== Motion-safe ====== */
  @media (prefers-reduced-motion: reduce){
    *{ animation: none important; transition: none important }
  }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-transparent pt-3">
    <div class="container">
      <a class="navbar-brand fw-semibold text-white d-flex align-items-center gap-2" href="#">
        <span class="bg-white/20 text-white px-3 py-1 rounded-pill border border-light-subtle">
          <i class="bi bi-robot"></i> Operaciones con IA
        </span>
      </a>
    </div>
  </nav>

  <!-- Main -->
  <main class="flex-shrink-0 py-5">
    <div class="container">
      <div class="text-center mb-4">
        <h1 class="display-5 fw-bold text-white">Calculadora Inteligente</h1>
        <p class="lead text-white-50 mb-3">
          Escribe cualquier operación aritmética en lenguaje natural.
        </p>
      </div>

      <!-- Card -->
      <div class="card mx-auto glass-card shadow-lg" style="max-width: 980px;">
        <div class="card-body p-4 p-md-5">
          <h6 class="text-uppercase text-muted mb-3">Tu consulta</h6>

          <textarea id="textoOperacion" class="form-control form-control-lg mb-3 rounded-4"
            rows="5" placeholder="Ej: ¿Cuánto es (48+45)-(4*56) / 10?"></textarea>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <small class="text-muted">Consejo: usa <kbd>Ctrl</kbd> + <kbd>Enter</kbd> para enviar</small>
            <span class="badge rounded-pill text-bg-light opacity-75">IA · OpenAI · n8n</span>
          </div>

          <button id="btnCalcular" class="btn btn-gradient btn-lg w-100 rounded-4">
            Realizar
          </button>

          <!-- Resultado -->
          <div id="resultadoWrap" class="mt-4 d-none">
            <div class="alert alert-dark rounded-4 mb-0" role="alert">
              <div class="d-flex align-items-start gap-3">
                <i class="bi bi-calculator fs-3"></i>
                <div>
                  <div class="small text-uppercase text-muted">Resultado</div>
                  <div id="resultadoTexto" class="fs-5 fw-semibold">—</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Error -->
          <div id="errorWrap" class="mt-4 d-none">
            <div class="alert alert-danger rounded-4 mb-0" role="alert">
              <div class="d-flex align-items-start gap-3">
                <i class="bi bi-exclamation-triangle fs-3"></i>
                <div>
                  <div class="small text-uppercase text-muted">Error</div>
                  <div id="errorTexto" class="fs-6">—</div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="mt-auto py-4">
    <div class="container text-center text-white-50 small">
      Hecho por David Fidel Guzmán Sánchez
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
